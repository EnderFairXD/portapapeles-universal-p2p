[package]
name = "clipsync"
version = "0.1.0"
description = "ClipSync — cliente de escritorio del portapapeles universal P2P"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "clipsync_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
mdns-sd = "0.21.4"
tokio = { version = "1.53.1", features = ["full"] }
sha2 = "0.11.0"
hostname = "0.4.2"
hex = "0.4.3"
base64 = "0.23.1"
dirs = "7.0.0"
uuid = { version = "1.26.1", features = ["v4"] }
tokio-util = { version = "0.7.20", features = ["codec"] }
futures = "0.3.34"
thiserror = "2.0.21"
tauri-plugin-dialog = "2"
snow = "0.10.0"
x25519-dalek = { version = "2", features = ["static_secrets"] }
getrandom = "0.3"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
if-addrs = "0.15"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# `tauri dev`: el sondeo decodifica el PNG de la imagen del portapapeles cada segundo; sin
# optimizar estas dependencias costaría mucha CPU en debug
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3

[dev-dependencies]
tokio = { version = "1.53.1", features = ["full", "test-util"] }
bytes = "1.12.1"
tempfile = "3.27.0"

[target.'cfg(target_os = "linux")'.dependencies]
bluer = { version = "0.17.4", features = ["rfcomm", "bluetoothd"] }
